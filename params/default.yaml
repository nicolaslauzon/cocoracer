default_track: stadium

simulation:
  tick_hz: 40
  physics_substeps: 4

vehicle:
  lf: 0.15875
  lr: 0.17145
  length: 0.5
  width: 0.4
  max_speed: 10.0
  min_speed: 0.0
  max_accel: 3.0
  max_steer: 0.5
  min_steer: -0.5
  max_steer_rate: 3.0
  min_steer_rate: -3.0

sensor:
  beam_count: 72

race:
  laps: 3
  time_limit: 300.0
  crash_pause: 0.5
  ghost_duration: 1.5
  collision_distance: 0.5
  max_crashes: 5
  countdown: 3.0
  grid_spacing: 1.5

tracks:
  stadium:
    width: 1.0
    resolution: 0.05
    segments:
      - { type: straight, length: 6.0 }
      - { type: turn, radius: 2.0, angle: 180.0 }
      - { type: straight, length: 6.0 }
      - { type: turn, radius: 2.0, angle: 180.0 }

baselines:
  pure_pursuit:
    wheelbase: 0.3302
    max_steer: 0.5
    lookahead_slope: 0.4
    lookahead_offset: 1.0
    min_lookahead: 0.5
    max_lookahead: 4.0
    target_speed: 4.0
  wall_follow:
    target_wall_distance: 0.3
    kp: 1.0
    kd: 0.1
    v_ref: 4.0
    steer_speed_factor: 0.5
    sector_half_angle: 60.0
  gap_follow:
    cone_half_angle: 60.0
    lookahead: 2.0
    k_gap: 2.0
    v_max: 5.0
    steer_speed_factor: 0.5
