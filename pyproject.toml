[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoracer"
version = "0.1.0"
description = "Program your own autonomous controller and race it against baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "jax>=0.4",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "scipy-stubs>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
cocoracer = "cocoracer.cli:main"
cocoracer-demo = "cocoracer.demo:main"

[tool.setuptools.packages.find]
include = ["cocoracer*"]

[tool.setuptools.package-data]
cocoracer = ["web/*.html", "web/*.png", "bundled/*.py", "bundled/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-race E2E tests (opt-in with -m slow)",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
