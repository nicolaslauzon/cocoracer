<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cocoracer</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141a; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px; margin: 0;
    color: #e8ecf1;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre;
    background: rgba(13, 17, 23, 0.6);
    padding: 8px 10px; border-radius: 6px;
    pointer-events: none;
  }
  #start {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font: 700 28px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #10141a;
    background: #ffd43b;
    border: none; border-radius: 8px;
    padding: 16px 44px;
    cursor: pointer;
  }
  #countdown {
    position: fixed; top: 38%; left: 50%;
    transform: translate(-50%, -50%);
    font: 700 140px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #ffd43b;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<pre id="hud">connecting…</pre>
<div id="countdown" hidden></div>
<button id="start" hidden>Start</button>
<script>
"use strict";

const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const countdownEl = document.getElementById("countdown");
const startBtn = document.getElementById("start");

const STATUS_COLORS = {
  finished: "#ffffff",
  dnf: "#000000",
  paused: "#9aa4b2",
  ghost: "#9aa4b2"
};
const ALPHAS = { ghost: 0.4, paused: 0.6 };

// Bright identity palette, assigned by grid order; vehicles beyond the
// palette get a deterministic hue derived from their name, so colors
// are stable across page reloads.
const PALETTE = [
  "#ff4fd8",
  "#3f7bff",
  "#ff3f3f",
  "#35d13f",
  "#ffe13f",
  "#ff8c1a",
  "#a64dff",
  "#00e5d0"
];

function hslToHex(h, s, l) {
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c)
      .toString(16)
      .padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}

function colorFor(v) {
  if (v.status === "racing") {
    if (v.id < PALETTE.length) return PALETTE[v.id];
    let h = 0;
    for (const ch of v.name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return hslToHex(h % 360, 0.9, 0.55);
  }
  return STATUS_COLORS[v.status] ?? "#ffffff";
}

let staticMsg = null;
let dynamicMsg = null;
let trackLayer = null;
let view = null;
let trails = {};

function computeView() {
  if (!staticMsg) return null;
  let minx = Infinity;
  let miny = Infinity;
  let maxx = -Infinity;
  let maxy = -Infinity;
  for (const key of ["centerline", "left_wall", "right_wall"]) {
    for (const p of staticMsg[key]) {
      minx = Math.min(minx, p[0]);
      maxx = Math.max(maxx, p[0]);
      miny = Math.min(miny, p[1]);
      maxy = Math.max(maxy, p[1]);
    }
  }
  const pad = Math.max(10, staticMsg.track_length * 0.02);
  minx -= pad;
  miny -= pad;
  maxx += pad;
  maxy += pad;
  const scale = Math.min(
    canvas.width / (maxx - minx),
    canvas.height / (maxy - miny)
  );
  const ox = (canvas.width - (maxx - minx) * scale) / 2;
  const oy = (canvas.height - (maxy - miny) * scale) / 2;
  return {
    scale,
    toPx(x, y) {
      return [ox + (x - minx) * scale, oy + (maxy - y) * scale];
    }
  };
}

function pathCenterline(t) {
  t.beginPath();
  staticMsg.centerline.forEach((p, i) => {
    const [sx, sy] = view.toPx(p[0], p[1]);
    if (i === 0) t.moveTo(sx, sy);
    else t.lineTo(sx, sy);
  });
  t.closePath();
}

function pathWalls(t) {
  for (const key of ["left_wall", "right_wall"]) {
    staticMsg[key].forEach((p, i) => {
      const [sx, sy] = view.toPx(p[0], p[1]);
      if (i === 0) t.moveTo(sx, sy);
      else t.lineTo(sx, sy);
    });
    t.closePath();
  }
}

function drawRoad(t) {
  t.beginPath();
  pathWalls(t);
  t.fillStyle = "#252c36";
  t.fill("evenodd");
  t.strokeStyle = "rgba(232, 236, 241, 0.35)";
  t.lineWidth = Math.max(1, 0.06 * view.scale);
  t.setLineDash([0.4 * view.scale, 0.4 * view.scale]);
  pathCenterline(t);
  t.stroke();
  t.setLineDash([]);
}

function drawStartLine(t) {
  const sl = staticMsg.start_line;
  const [ax, ay] = view.toPx(sl.left[0], sl.left[1]);
  const [bx, by] = view.toPx(sl.right[0], sl.right[1]);
  t.strokeStyle = "#ffffff";
  t.lineWidth = Math.max(2, 0.1 * view.scale);
  t.beginPath();
  t.moveTo(ax, ay);
  t.lineTo(bx, by);
  t.stroke();
}

function prerenderTrack() {
  if (!staticMsg || !view) return;
  trackLayer = document.createElement("canvas");
  trackLayer.width = canvas.width;
  trackLayer.height = canvas.height;
  const t = trackLayer.getContext("2d");
  if (staticMsg.map_image) {
    drawMapImage(t);
  } else {
    drawRoad(t);
  }
  drawStartLine(t);
}

// The map's display image: world frame is image pixels times the map's
// scale, origin at the image's bottom-left corner, y up. The raw PGM is
// recolored to the track's dark theme so walls stay black, the road is
// drawn in the old road color, and the surroundings fall to the page
// background. On screen the image is world-meters times view.scale px/m.
function drawMapImage(t) {
  const mi = staticMsg.map_image;
  const img = new Image();
  img.onload = () => {
    const [x0, y0] = view.toPx(0, mi.height * mi.scale);
    const worldW = mi.width * mi.scale;
    const worldH = mi.height * mi.scale;
    t.imageSmoothingEnabled = false;
    t.drawImage(recolorMap(img), x0, y0, worldW * view.scale, worldH * view.scale);
    drawStartLine(t);
    draw();
  };
  img.src = mi.url;
}

// Grayscale(ish) PGM -> dark theme: bright road pixels -> #252c36,
// black wall outlines stay black, everything else -> page background #10141a.
function recolorMap(img) {
  const c = document.createElement("canvas");
  c.width = img.width;
  c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  const id = g.getImageData(0, 0, c.width, c.height);
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = d[i]; // grayscale: r == g == b
    if (v >= 224) {
      d[i] = 0x25; d[i + 1] = 0x2c; d[i + 2] = 0x36; d[i + 3] = 255; // road #252c36
    } else if (v < 32) {
      d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 255; // outline #000000
    } else {
      d[i] = 0x10; d[i + 1] = 0x14; d[i + 2] = 0x1a; d[i + 3] = 255; // bg #10141a
    }
  }
  g.putImageData(id, 0, 0);
  return c;
}

// The pixel-art F1 sprite: the red channel of its body pixels encodes
// brightness (255 = body, 128 = shade), black tires stay black. One
// recolored offscreen copy per color, built at load from the single
// editable f1-car.png.
const SPRITE_URL = "f1-car.png";
let carSprite = null;
const spriteCache = {};
const spriteImage = new Image();
spriteImage.onload = () => {
  carSprite = spriteImage;
  draw();
};
spriteImage.src = SPRITE_URL;

function tintedSprite(color) {
  if (!carSprite) return null;
  if (spriteCache[color]) return spriteCache[color];
  const c = document.createElement("canvas");
  c.width = carSprite.width;
  c.height = carSprite.height;
  const t = c.getContext("2d");
  t.drawImage(carSprite, 0, 0);
  const img = t.getImageData(0, 0, c.width, c.height);
  const m = img.data;
  const rgb = parseInt(color.slice(1), 16);
  const vr = (rgb >> 16) & 255;
  const vg = (rgb >> 8) & 255;
  const vb = rgb & 255;
  for (let i = 0; i < m.length; i += 4) {
    if (m[i + 3] === 0 || m[i] + m[i + 1] + m[i + 2] < 90) continue;
    const k = m[i] / 255;
    m[i] = vr * k;
    m[i + 1] = vg * k;
    m[i + 2] = vb * k;
  }
  t.putImageData(img, 0, 0);
  spriteCache[color] = c;
  return c;
}

function drawCar(v) {
  const spr = tintedSprite(colorFor(v));
  if (!spr) return;
  const [cx, cy] = view.toPx(v.x, v.y);
  const len = Math.max(8, staticMsg.vehicle.length * view.scale);
  const wid = Math.max(4, staticMsg.vehicle.width * view.scale);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-v.yaw);
  // The sprite's nose points up its local -y; rotate a quarter turn
  // clockwise so it points along the heading.
  ctx.rotate(Math.PI / 2);
  ctx.globalAlpha = ALPHAS[v.status] ?? 1;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(spr, -wid / 2, -len / 2, wid, len);
  ctx.restore();
}

function trailWindow() {
  return staticMsg.track_length / 2;
}

function updateTrails(msg) {
  const win = trailWindow();
  for (const v of msg.vehicles) {
    let tr = trails[v.id];
    if (!tr) tr = (trails[v.id] = { dist: 0, points: [], mark: null, crashes: 0 });
    const crashed = v.crashes > tr.crashes;
    tr.crashes = v.crashes;
    const last = tr.points.length ? tr.points[tr.points.length - 1] : null;
    if (crashed) {
      const cp = v.last_crash ?? { x: v.x, y: v.y };
      tr.mark = { x: cp.x, y: cp.y, d: tr.dist };
    } else if (last) {
      tr.dist += Math.hypot(v.x - last.x, v.y - last.y);
    }
    tr.points.push({ x: v.x, y: v.y, d: tr.dist, b: !last || crashed });
    const cut = tr.dist - win;
    while (tr.points.length && tr.points[0].d < cut) tr.points.shift();
    if (tr.mark && tr.mark.d < cut) tr.mark = null;
  }
}

function drawTrails() {
  const win = trailWindow();
  for (const v of dynamicMsg.vehicles) {
    const tr = trails[v.id];
    if (!tr || tr.points.length < 2) continue;
    ctx.strokeStyle = colorFor(v);
    ctx.lineWidth = Math.max(1, 2.0 * view.scale);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    let started = false;
    for (let i = 1; i < tr.points.length; i++) {
      const a = tr.points[i - 1];
      const b = tr.points[i];
      if (b.b) {
        started = false;
        continue;
      }
      const [ax, ay] = view.toPx(a.x, a.y);
      const [bx, by] = view.toPx(b.x, b.y);
      if (!started) {
        ctx.moveTo(ax, ay);
        started = true;
      }
      ctx.lineTo(bx, by);
    }
    ctx.stroke();
    // Soften the oldest quarter without breaking the solid path into dots.
    const tailEnd = Math.max(1, Math.floor(tr.points.length / 4));
    ctx.globalCompositeOperation = "destination-out";
    for (let i = 1; i < tailEnd; i++) {
      const a = tr.points[i - 1];
      const b = tr.points[i];
      if (b.b) continue;
      const [ax, ay] = view.toPx(a.x, a.y);
      const [bx, by] = view.toPx(b.x, b.y);
      ctx.globalAlpha = 0.7 * (1 - i / tailEnd);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(bx, by);
      ctx.stroke();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;
}

function drawCrashMarks() {
  const win = trailWindow();
  const r = Math.max(8, 0.6 * view.scale);
  ctx.lineWidth = Math.max(1.5, 0.08 * view.scale);
  ctx.lineCap = "round";
  for (const v of dynamicMsg.vehicles) {
    const tr = trails[v.id];
    if (!tr) continue;
    if (!tr.mark) continue;
    const m = tr.mark;
    const [mx, my] = view.toPx(m.x, m.y);
    ctx.strokeStyle = colorFor(v);
    ctx.globalAlpha = Math.min(1, (m.d - Math.max(0, tr.dist - win)) / win);
    ctx.beginPath();
    ctx.moveTo(mx - r, my - r);
    ctx.lineTo(mx + r, my + r);
    ctx.moveTo(mx + r, my - r);
    ctx.lineTo(mx - r, my + r);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  if (!staticMsg || !view) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (trackLayer) ctx.drawImage(trackLayer, 0, 0);
  if (!dynamicMsg) return;
  drawTrails();
  drawCrashMarks();
  for (const v of dynamicMsg.vehicles) drawCar(v);
}

function fmtClock(s) {
  const m = Math.floor(s / 60);
  const r = s - m * 60;
  return String(m).padStart(2, "0") + ":" + r.toFixed(2).padStart(5, "0");
}

function fmtLap(s) {
  return s === null ? "-" : s.toFixed(2) + "s";
}

function hudText() {
  if (!dynamicMsg) return "waiting for race state…";
  const head =
    "t=" + fmtClock(dynamicMsg.time) + "  " + dynamicMsg.phase +
    (dynamicMsg.countdown > 0
      ? "  countdown " + dynamicMsg.countdown.toFixed(1)
      : "");
  const lines = [head];
  for (const v of dynamicMsg.vehicles) {
    const fin =
      v.finish_time === null ? "" : "  finished " + fmtClock(v.finish_time);
    lines.push(
      v.name + "  " + v.status + "  lap " + v.laps +
      "  " + v.speed.toFixed(1) + " m/s" +
      "  steer " + v.steering.toFixed(2) +
      "  crashes " + v.crashes +
      "  best " + fmtLap(v.best_lap) +
      "  last " + fmtLap(v.last_lap) + fin
    );
  }
  return lines.join("\n");
}

function refreshHud() {
  hud.textContent = hudText();
  if (dynamicMsg && dynamicMsg.countdown > 0) {
    countdownEl.hidden = false;
    countdownEl.textContent = String(Math.ceil(dynamicMsg.countdown));
  } else {
    countdownEl.hidden = true;
  }
  startBtn.hidden = !dynamicMsg || dynamicMsg.phase !== "waiting";
}

function fit() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  view = computeView();
  prerenderTrack();
  draw();
}

window.addEventListener("resize", fit);

startBtn.addEventListener("click", () => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "start" }));
  }
});

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"
);
ws.onopen = () => { hud.textContent = "connected"; };
ws.onmessage = (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.type === "static") {
    staticMsg = msg;
    trails = {};
    fit();
  } else if (msg.type === "dynamic") {
    dynamicMsg = msg;
    updateTrails(msg);
    refreshHud();
    draw();
  }
};
ws.onclose = () => { hud.textContent = "disconnected"; };
ws.onerror = () => { hud.textContent = "connection failed"; };

fit();
</script>
</body>
</html>
