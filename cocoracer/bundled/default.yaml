default_track: stadium

simulation:
  tick_hz: 40
  physics_substeps: 4

vehicle:
  lf: 0.79
  lr: 0.86
  length: 2.5
  width: 2.0
  max_speed: 25.0
  min_speed: 0.0
  max_accel: 8.0
  max_steer: 0.5
  min_steer: -0.5
  max_steer_rate: 4.0
  min_steer_rate: -4.0

sensor:
  beam_count: 72

race:
  laps: 3
  time_limit: 600.0
  crash_pause: 2.0
  ghost_duration: 1.5
  collision_distance: 2.5
  max_crashes: 5
  countdown: 3.0

tracks:
  stadium:
    width: 20.0
    resolution: 0.3
    segments:
      - { type: straight, length: 120.0 }
      - { type: turn, radius: 40.0, angle: 180.0 }
      - { type: straight, length: 120.0 }
      - { type: turn, radius: 40.0, angle: 180.0 }

baselines:
  wall_follow:
    target_wall_distance: 6.0
    kp: 0.45
    kd: 2.0
    v_ref: 4.0
    steer_speed_factor: 0.5
    sector_half_angle: 60.0
